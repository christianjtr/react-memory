name: Deploy to GitHub Pages

on:
  push:
    branches: [develop]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'postcss.config.*'
      - 'tailwind.config.*'
      - 'eslint.config.*'
      - '.prettierrc*'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: GITHUB_ACTIONS=true npm run build

      - name: Publish to demo branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan deploy-demo
          cp -R dist/. .
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7} to demo"
          git push origin HEAD:demo --force
